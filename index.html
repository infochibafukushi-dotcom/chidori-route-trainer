  <script>
  /* Boot diagnostics — must never block startup. Overlay: ?diag=1 or localStorage.chidoriBootDiag=1 */
  (function () {
    try {
      var marks = [];
      var t0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
      function mark(name, extra) {
        try {
          var entry = { name: name, ms: Math.round(((typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now()) - t0), extra: extra || null };
          marks.push(entry);
          if (typeof console !== 'undefined' && console.info) console.info('[chidori-boot]', entry.name, entry.ms + 'ms', extra || '');
          var el = document.getElementById('chidori-boot-diag');
          if (el) el.textContent = marks.map(function (m) { return m.ms + 'ms ' + m.name; }).join('\n');
        } catch (e) {}
      }
      window.__chidoriBoot = {
        mark: mark,
        marks: marks,
        dump: function () { return marks.slice(); }
      };
      mark('html-reached');
      window.addEventListener('error', function (ev) {
        mark('window.onerror', String((ev && ev.message) || 'error'));
      });
      window.addEventListener('unhandledrejection', function (ev) {
        mark('unhandledrejection', String((ev && ev.reason && (ev.reason.message || ev.reason)) || 'rejection'));
      });
      document.addEventListener('DOMContentLoaded', function () { mark('DOMContentLoaded'); });
      window.addEventListener('load', function () {
        mark('window.load');
        try {
          var standalone = false;
          try { standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true; } catch (e) {}
          mark('display-mode', standalone ? 'standalone' : 'browser');
          if (!('serviceWorker' in navigator)) {
            mark('sw-unsupported');
            return;
          }
          mark('sw-controller', navigator.serviceWorker.controller ? navigator.serviceWorker.controller.scriptURL : 'none');
          navigator.serviceWorker.getRegistration().then(function (reg) {
            if (!reg) { mark('sw-registration', 'none'); return; }
            mark('sw-registration', {
              active: reg.active && reg.active.scriptURL,
              waiting: reg.waiting && reg.waiting.scriptURL,
              installing: reg.installing && reg.installing.scriptURL
            });
          }).catch(function (err) { mark('sw-registration-error', String(err && err.message || err)); });
        } catch (e) { mark('sw-probe-error', String(e && e.message || e)); }
      });
      var showDiag = false;
      try {
        showDiag = /(?:\?|&)diag=1(?:&|$)/.test(location.search) || localStorage.getItem('chidoriBootDiag') === '1';
      } catch (e) {}
      if (showDiag) {
        document.addEventListener('DOMContentLoaded', function () {
          try {
            var box = document.createElement('pre');
            box.id = 'chidori-boot-diag';
            box.setAttribute('aria-hidden', 'true');
            box.style.cssText = 'position:fixed;left:0;right:0;bottom:0;max-height:30vh;overflow:auto;margin:0;padding:8px;background:rgba(0,0,0,.75);color:#9f9;font:11px/1.4 monospace;z-index:99999;pointer-events:none';
            document.body.appendChild(box);
            box.textContent = marks.map(function (m) { return m.ms + 'ms ' + m.name; }).join('\n');
          } catch (e) {}
        });
      }
      var appWatch = setInterval(function () {
        try {
          var app = document.getElementById('app');
          if (app && app.querySelector('.app')) {
            mark('render-dom');
            clearInterval(appWatch);
          }
        } catch (e) { clearInterval(appWatch); }
      }, 50);
      setTimeout(function () { try { clearInterval(appWatch); } catch (e) {} }, 15000);
    } catch (e) {}
  })();
  </script>

  <script>
  /* Defer route-only CSS/JS so home stays interactive. Features unchanged. */
  (function () {
    var css = [
      './hokuei-route.css?v=33',
      './stop-editor-v8.css?v=32',
      './hokuei-authoritative-v12.css?v=32',
      './hokuei-manual-override-v13.css?v=33',
      './hokuei-driving-v14.css?v=32',

      './hokuei-stop-images-v25.css?v=32',
      './urayasu-higashi-danchi-stop-images-v1.css?v=63',
      './tomioka-stop-images-v1.css?v=65',
      './horie-stop-images-v1.css?v=66',
      './shiyakusho-stop-images-v1.css?v=67',
      './maihama-line-stop-images-v1.css?v=69',
      './takasu-line-stop-images-v1.css?v=72',
      './symbol-road-line-stop-images-v1.css?v=73',
      './maihama-resort-line-stop-images-v1.css?v=74'
    ];
    var scripts = [
      './hokuei-authoritative-v12.js?v=33',
      './hokuei-manual-override-v13.js?v=33',
      './hokuei-shared-coordinates-v15.js?v=32',
      './hokuei-no-uturn-v17.js?v=74',
      './imagawa-directions-compat-v2.js?v=56',
      './hokuei-streetview-stops-v26.js?v=32',
      './hokuei-guidance-v22.js?v=57',
      './hokuei-stop-images-v25.js?v=32',
      { mark: 'STOP_EDITOR_BEFORE_IMAGAWA' },
      './imagawa-urayasu-maihama-path-v1o.js?v=56',
      './imagawa-chidori-garage-path-v1.js?v=58',
      './imagawa-route-v1.js?v=58',
      './imagawa-path-policy-v3.js?v=56',
      { mark: 'STOP_EDITOR_IMAGAWA' },
      './urayasu-higashi-danchi-platforms-v1.js?v=63',
      './urayasu-higashi-danchi-path-v1.js?v=63',
      './urayasu-higashi-danchi-path-policy-v1.js?v=63',
      './urayasu-higashi-danchi-route-v1.js?v=63',
      { mark: 'STOP_EDITOR_URAYASU_HIGASHI' },
      './tomioka-platforms-v1.js?v=65',
      './tomioka-path-v1.js?v=65',
      './tomioka-path-policy-v1.js?v=65',
      './tomioka-stop-images-v1.js?v=65',
      './tomioka-route-v1.js?v=65',
      { mark: 'STOP_EDITOR_TOMIOKA' },
      './horie-platforms-v1.js?v=66',
      './horie-path-v1.js?v=66',
      './horie-path-policy-v1.js?v=66',
      './horie-stop-images-v1.js?v=66',
      './horie-route-v1.js?v=66',
      { mark: 'STOP_EDITOR_HORIE' },
      './shiyakusho-platforms-v1.js?v=67',
      './shiyakusho-path-v1.js?v=67',
      './shiyakusho-path-policy-v1.js?v=67',
      './shiyakusho-stop-images-v1.js?v=67',
      './shiyakusho-route-v1.js?v=67',
      { mark: 'STOP_EDITOR_SHIYAKUSHO' },
      './maihama-line-platforms-v1.js?v=69',
      './maihama-line-path-v1.js?v=69',
      './maihama-line-path-policy-v1.js?v=69',
      './maihama-line-stop-images-v1.js?v=69',
      './maihama-line-route-v1.js?v=69',
      { mark: 'STOP_EDITOR_MAIHAMA_LINE' },
      './takasu-line-platforms-v1.js?v=72',
      './takasu-line-path-v1.js?v=72',
      './takasu-line-path-policy-v1.js?v=72',
      './takasu-line-stop-images-v1.js?v=72',
      './takasu-line-route-v1.js?v=72',
      { mark: 'STOP_EDITOR_TAKASU_LINE' },
      './symbol-road-line-platforms-v1.js?v=73',
      './symbol-road-line-path-v1.js?v=73',
      './symbol-road-line-path-policy-v1.js?v=73',
      './symbol-road-line-stop-images-v1.js?v=73',
      './symbol-road-line-route-v1.js?v=73',
      { mark: 'STOP_EDITOR_SYMBOL_ROAD_LINE' },
      './maihama-resort-line-platforms-v1.js?v=74',
      './maihama-resort-line-path-v1.js?v=74',
      './maihama-resort-line-path-policy-v1.js?v=74',
      './maihama-resort-line-stop-images-v1.js?v=74',
      './maihama-resort-line-route-v1.js?v=74',
      { bridge: true }
    ];

    var promise = null;
    var ready = false;

    function loadCss(href) {
      return new Promise(function (resolve) {
        try {
          if (document.querySelector('link[data-chidori-deferred="' + href + '"]')) {
            resolve();
            return;
          }
          var link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href = href;
          link.setAttribute('data-chidori-deferred', href);
          link.onload = function () { resolve(); };
          link.onerror = function () {
            try { console.warn('[chidori] deferred css failed', href); } catch (e) {}
            resolve();
          };
          document.head.appendChild(link);
        } catch (e) { resolve(); }
      });
    }

    function loadJs(src) {
      return new Promise(function (resolve) {
        try {
          var script = document.createElement('script');
          script.src = src;
          script.async = false;
          script.onload = function () { resolve(); };
          script.onerror = function () {
            try { console.warn('[chidori] deferred js failed', src); } catch (e) {}
            resolve();
          };
          document.body.appendChild(script);
        } catch (e) { resolve(); }
      });
    }

    function installStopEditorBridge() {
      var route12StopEditor = stopEditor;
      var route11StopEditor = window.STOP_EDITOR_SYMBOL_ROAD_LINE;
      var route10StopEditor = window.STOP_EDITOR_TAKASU_LINE;
      var route9StopEditor = window.STOP_EDITOR_MAIHAMA_LINE;
      var route6StopEditor = window.STOP_EDITOR_SHIYAKUSHO;
      var route5StopEditor = window.STOP_EDITOR_HORIE;
      var route4StopEditor = window.STOP_EDITOR_TOMIOKA;
      var route3StopEditor = window.STOP_EDITOR_URAYASU_HIGASHI;
      var imagawaStopEditor = window.STOP_EDITOR_IMAGAWA;
      var baseStopEditor = window.STOP_EDITOR_BEFORE_IMAGAWA;
      stopEditor = function stopEditorRouteBridge() {
        if (routeState && routeState.routeId === 'route-12') return route12StopEditor();
        if (routeState && routeState.routeId === 'route-11') return route11StopEditor();
        if (routeState && routeState.routeId === 'route-10') return route10StopEditor();
        if (routeState && routeState.routeId === 'route-9') return route9StopEditor();
        if (routeState && routeState.routeId === 'route-6') return route6StopEditor();
        if (routeState && routeState.routeId === 'route-5') return route5StopEditor();
        if (routeState && routeState.routeId === 'route-4') return route4StopEditor();
        if (routeState && routeState.routeId === 'route-3') return route3StopEditor();
        if (routeState && routeState.routeId === 'route-2') return imagawaStopEditor();
        return baseStopEditor();
      };
      document.addEventListener('change', function (event) {
        if (!event.target || event.target.id !== 'sRoute') return;
        routeState.routeId = event.target.value;
        setTimeout(function () { stopEditor(); }, 0);
      }, true);
    }

    function ensure() {
      if (promise) return promise;
      promise = (async function () {
        try { window.__chidoriBoot && window.__chidoriBoot.mark('deferred-assets-start'); } catch (e) {}
        await Promise.all(css.map(loadCss));
        for (var i = 0; i < scripts.length; i += 1) {
          var item = scripts[i];
          if (typeof item === 'string') {
            await loadJs(item);
          } else if (item && item.mark) {
            window[item.mark] = stopEditor;
          } else if (item && item.bridge) {
            installStopEditorBridge();
          }
        }
        ready = true;
        try { window.__chidoriBoot && window.__chidoriBoot.mark('deferred-assets-ready'); } catch (e) {}
      })();
      return promise;
    }

    window.__chidoriRouteAssets = {
      ensure: ensure,
      isReady: function () { return ready; }
    };

    function startDeferred() {
      ensure().catch(function (err) {
        try { console.warn('[chidori] deferred assets failed', err); } catch (e) {}
      });
    }

    // Home already rendered above; start route packs immediately in background.
    setTimeout(startDeferred, 0);
  })();
  </script>
