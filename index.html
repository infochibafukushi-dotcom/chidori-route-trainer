  <script>
  /* Boot diagnostics — never blocks startup. Overlay: ?diag=1 or localStorage.chidoriBootDiag=1 */
  (function () {
    try {
      var marks = [];
      var t0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
      function mark(name, extra) {
        try {
          var entry = { name: name, ms: Math.round(((typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now()) - t0), extra: extra || null };
          marks.push(entry);
          if (typeof console !== 'undefined' && console.info) console.info('[chidori-boot]', entry.name, entry.ms + 'ms', extra || '');
          var el = document.getElementById('chidori-boot-diag');
          if (el) el.textContent = marks.map(function (m) { return m.ms + 'ms ' + m.name + (m.extra != null ? ' ' + JSON.stringify(m.extra) : ''); }).join('\n');
        } catch (e) {}
      }
      window.__chidoriBoot = { mark: mark, marks: marks, dump: function () { return marks.slice(); } };
      window.__chidoriDeferD1 = true;
      mark('html-reached');
      window.addEventListener('error', function (ev) {
        mark('window.onerror', String((ev && ev.message) || 'error'));
      });
      window.addEventListener('unhandledrejection', function (ev) {
        mark('unhandledrejection', String((ev && ev.reason && (ev.reason.message || ev.reason)) || 'rejection'));
      });
      document.addEventListener('DOMContentLoaded', function () { mark('DOMContentLoaded'); });
      window.addEventListener('load', function () {
        mark('window.load');
        try {
          var standalone = false;
          try { standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true; } catch (e) {}
          mark('display-mode', standalone ? 'standalone' : 'browser');
          if (!('serviceWorker' in navigator)) { mark('sw-unsupported'); return; }
          mark('sw-controller', navigator.serviceWorker.controller ? navigator.serviceWorker.controller.scriptURL : 'none');
          navigator.serviceWorker.getRegistration().then(function (reg) {
            if (!reg) { mark('sw-registration', 'none'); return; }
            mark('sw-registration', {
              active: reg.active && reg.active.scriptURL,
              waiting: reg.waiting && reg.waiting.scriptURL,
              installing: reg.installing && reg.installing.scriptURL
            });
          }).catch(function (err) { mark('sw-registration-error', String(err && err.message || err)); });
        } catch (e) { mark('sw-probe-error', String(e && e.message || e)); }
      });
      var showDiag = false;
      try {
        showDiag = /(?:\?|&)diag=1(?:&|$)/.test(location.search) || localStorage.getItem('chidoriBootDiag') === '1';
      } catch (e) {}
      if (showDiag) {
        document.addEventListener('DOMContentLoaded', function () {
          try {
            var box = document.createElement('pre');
            box.id = 'chidori-boot-diag';
            box.setAttribute('aria-hidden', 'true');
            box.style.cssText = 'position:fixed;left:0;right:0;bottom:0;max-height:30vh;overflow:auto;margin:0;padding:8px;background:rgba(0,0,0,.75);color:#9f9;font:11px/1.4 monospace;z-index:99999;pointer-events:none';
            document.body.appendChild(box);
            box.textContent = marks.map(function (m) { return m.ms + 'ms ' + m.name; }).join('\n');
          } catch (e) {}
        });
      }
      var appWatch = setInterval(function () {
        try {
          var app = document.getElementById('app');
          if (app && app.querySelector('.app')) {
            mark('render-dom');
            clearInterval(appWatch);
          }
        } catch (e) { clearInterval(appWatch); }
      }, 50);
      setTimeout(function () { try { clearInterval(appWatch); } catch (e) {} }, 15000);
    } catch (e) {}
  })();
  </script>

  <script>
  /* Safe-mode: no route packs, no D1 until home is interactive. No auto startDeferred. */
  (function () {
    function loadScript(src) {
      return new Promise(function (resolve, reject) {
        var s = document.createElement('script');
        s.src = src;
        s.async = true;
        var t = setTimeout(function () {
          s.onload = s.onerror = null;
          if (s.parentNode) s.parentNode.removeChild(s);
          reject(new Error('timeout ' + src));
        }, 5000);
        s.onload = function () { clearTimeout(t); resolve(); };
        s.onerror = function () {
          clearTimeout(t);
          if (s.parentNode) s.parentNode.removeChild(s);
          reject(new Error('failed ' + src));
        };
        document.body.appendChild(s);
      });
    }

    var d1Promise = null;
    function ensureD1() {
      if (window.__chidoriStartD1) {
        window.__chidoriStartD1();
        return Promise.resolve();
      }
      if (d1Promise) return d1Promise;
      d1Promise = loadScript('./d1-sync.js?v=61').then(function () {
        if (typeof window.__chidoriStartD1 === 'function') window.__chidoriStartD1();
      });
      return d1Promise;
    }

    window.__chidoriOnHomeInteractive = function () {
      try { window.__chidoriBoot && window.__chidoriBoot.mark('safe-home-ready'); } catch (e) {}
      // Defer D1 until after home is usable; never block taps.
      setTimeout(function () {
        ensureD1().catch(function (err) {
          console.warn('[chidori] deferred D1 failed', err);
          try { window.__chidoriBoot && window.__chidoriBoot.mark('d1-defer-error', String(err && err.message || err)); } catch (e) {}
        });
      }, 2500);
    };

    if (window.__chidoriHomeInteractive) {
      window.__chidoriOnHomeInteractive();
    }

    // If settings is opened before deferred D1 timer, load D1 then.
    var originalGo = null;
    function patchGoForD1() {
      if (typeof go !== 'function' || go.__chidoriD1Patched) return;
      originalGo = go;
      go = function goWithDeferredD1(next) {
        if (next === 'settings') {
          ensureD1().catch(function (err) { console.warn('[chidori] D1 before settings failed', err); });
        }
        return originalGo(next);
      };
      go.__chidoriD1Patched = true;
    }
    patchGoForD1();
    setTimeout(patchGoForD1, 0);
  })();
  </script>
